name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_eval:
        description: "Also run the live 20-thread eval (uses the GEMINI_API_KEY secret)"
        type: boolean
        default: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Offline tests (no API calls)
        run: python -m pytest -q
        env:
          GEMINI_API_KEY: dummy-key-for-offline-tests

  eval:
    # Manual only: the live eval makes ~60 free-tier API calls and can hit 503s
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_eval }}
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Live evaluation
        run: python eval.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: results.md
